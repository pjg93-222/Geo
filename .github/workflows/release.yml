# Release: on a v* tag, test, build the hosted image, push it to GHCR by digest, write its SBOM and digests.json, and attach
# both to a DRAFT release (publishing the release stays a manual step). CI is the only builder: no Docker is needed on the laptop.
# The same tag also builds the two Terrier BUILD images (Dockerfile.build: terrier-build, terrier-build-score; toolchain only, no
# code and no data) and attaches terrier-build.digests.json and their SBOMs; the laptop runs them by digest (COMPUTE.md). The
# draft-release job folds both into digests.json too (images.terrier-build, images.terrier-build-score), so they reach the platform's
# signed manifest and `ops/release_lib/current.py image terrier-build` resolves them.
#
# requirements.linux.lock (hashed, from requirements.linux.in) is committed, and every `uses:` below is pinned to a full commit SHA
# (the tag it was resolved from is the trailing comment; re-resolve with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
# The platform's ops/release.py reads digests.json from the draft release (images.terrier-web, and any other images.<name> whose ref is
# ghcr.io/pjg93-222/<name>@sha256:...) and the image's /version git_sha.
# A `scan` job runs the platform's image policy (D-181/D-182: tools/image_gate.py, trivy pinned by sha256) on all three images by digest;
# the draft release waits for it, so a failing image gets no release to attach to.
name: release

on:
  push:
    tags: ['v*']

permissions: {}          # nothing by default; each job asks only for what it needs

env:
  IMAGE: ghcr.io/pjg93-222/terrier-web
  BUILD_IMAGE: ghcr.io/pjg93-222/terrier-build
  SCORE_IMAGE: ghcr.io/pjg93-222/terrier-build-score

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The exact versions the laptop tests with (requirements.lock.txt pins them; it has no hashes), including the build-time
      # libraries the tests import. The hashed runtime lock is installed in the image build below.
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m compileall -q server tools manage.py
      # Synthetic data only. The suites that start from the aggregate summary bundle (data/*.zip, not in git) run on the laptop.
      - name: Django tests
        run: >
          python manage.py test
          server.research.test_access server.research.test_hosted server.research.test_districts
          server.research.test_walk_api server.research.test_walk_opt_ins server.research.tests.LocalAdministratorTests tools.test_districts tools.test_compute
          tools.test_image_gate
      - name: Deploy checks with a dummy hosted environment
        env:
          CU_DEPLOYMENT: hosted
          CU_SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-0123456789-abcdefghij-klmnopqrstu
          CU_ALLOWED_HOSTS: terrier.example.test,127.0.0.1
          CU_TRUSTED_ORIGINS: https://terrier.example.test
          CU_DATA_DIR: ${{ runner.temp }}/data
          CU_STATE_DIR: ${{ runner.temp }}/state
          CU_HTTPS_REDIRECT: '0'
        run: python manage.py check --deploy --fail-level WARNING

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Tag must be v<YYYY>.<MM>.<DD>.<n>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # a ref name may hold commas (buildx splits `outputs:` on them) or other odd characters: nothing runs on one
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::tag does not match v<YYYY>.<MM>.<DD>.<n>"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          {
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }}:${{ github.ref_name }},push=true,rewrite-timestamp=true
          no-cache: true           # a release image never takes a layer from a shared cache
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
      # No voter data may ride in the image (the data arrives as a read-only mount). field_dictionary.csv is the column
      # dictionary the app ships, not data.
      - name: Image must hold no data
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$REF" >/dev/null
          found=$(docker run --rm --entrypoint sh "$REF" -c \
            'find /app /data /state -xdev \( -name "*.zip" -o -name "*.sqlite*" -o -name "*.parquet" -o -name "*.csv" \) ! -name field_dictionary.csv 2>/dev/null || true')
          [ -z "$found" ] || { echo "::error::image contains data files:"; echo "$found"; exit 1; }
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: terrier-web.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # The shape ops/release.py parses (parse_digests): the same as the platform's digests.json, images.<name> = ref@digest.
      - name: digests.json
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
            '{tag: $tag, commit: $sha, images: {"terrier-web": $image}}' > digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            digests.json
            terrier-web.spdx.json
          if-no-files-found: error

  # The build toolchain images (Dockerfile.build): a hashed Linux lock each, bases pinned by digest, no code and no data inside.
  # The laptop's compute runs pull them by digest from terrier-build.digests.json (COMPUTE.md).
  build-image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      geo_digest: ${{ steps.geo.outputs.digest }}
      score_digest: ${{ steps.score.outputs.digest }}
    steps:
      - name: Tag must be v<YYYY>.<MM>.<DD>.<n>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::tag does not match v<YYYY>.<MM>.<DD>.<n>"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The locks are generated (their headers say how) and committed; an unhashed or missing one must stop the build here.
      - name: Locks must be hashed
        run: |
          for lock in requirements.build.lock requirements.score.lock; do
            [ -s "$lock" ] && grep -q -- '--hash=sha256:' "$lock" || { echo "::error::$lock is missing or has no hashes"; exit 1; }
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          {
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - id: geo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.build
          target: geo
          outputs: type=image,name=${{ env.BUILD_IMAGE }}:${{ github.ref_name }},push=true,rewrite-timestamp=true
          no-cache: true
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
      - id: score
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.build
          target: score
          outputs: type=image,name=${{ env.SCORE_IMAGE }}:${{ github.ref_name }},push=true,rewrite-timestamp=true
          no-cache: true
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
      # No code and no data may ride in either image (the build tree and the inputs arrive as read-only mounts); the toolchain
      # must import; the process must be uid 10001.
      - name: Images hold no data, run non-root and import their libraries
        env:
          GEO: ${{ env.BUILD_IMAGE }}@${{ steps.geo.outputs.digest }}
          SCORE: ${{ env.SCORE_IMAGE }}@${{ steps.score.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "$GEO" "$SCORE"; do
            docker pull "$ref" >/dev/null
            found=$(docker run --rm --entrypoint sh "$ref" -c 'find /terrier /stage /sources /geography /sibling /data -xdev -type f 2>/dev/null | head -5 || true')
            [ -z "$found" ] || { echo "::error::$ref contains files where data or code would be mounted:"; echo "$found"; exit 1; }
            [ "$(docker run --rm --entrypoint id "$ref" -u)" = 10001 ] || { echo "::error::$ref does not run as uid 10001"; exit 1; }
          done
          docker run --rm --entrypoint python "$GEO" -c 'import sys; assert sys.version_info[:3] == (3, 12, 14), sys.version; import django, geopandas, numpy, pandas, pyogrio, pyproj, requests, shapely; print("geo ok", geopandas.__version__, pyogrio.__gdal_version_string__)'
          docker run --rm --entrypoint python "$SCORE" -c 'import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version; import joblib, numpy, pandas, pyarrow, scipy; print("score ok", numpy.__version__, pandas.__version__)'
      - name: SBOM (terrier-build)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BUILD_IMAGE }}@${{ steps.geo.outputs.digest }}
          format: spdx-json
          output-file: terrier-build.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (terrier-build-score)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.SCORE_IMAGE }}@${{ steps.score.outputs.digest }}
          format: spdx-json
          output-file: terrier-build-score.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Same shape as digests.json (images.<name> = ref@digest). The draft-release job folds it into digests.json, which is what
      # ops/release.py reads; the file itself is attached too (COMPUTE.md step 4 reads it).
      - name: terrier-build.digests.json
        env:
          GEO_DIGEST: ${{ steps.geo.outputs.digest }}
          SCORE_DIGEST: ${{ steps.score.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$GEO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SCORE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" --arg geo "$BUILD_IMAGE@$GEO_DIGEST" --arg score "$SCORE_IMAGE@$SCORE_DIGEST" \
            '{tag: $tag, commit: $sha, images: {"terrier-build": $geo, "terrier-build-score": $score}}' > terrier-build.digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-files
          path: |
            terrier-build.digests.json
            terrier-build.spdx.json
            terrier-build-score.spdx.json
          if-no-files-found: error

  # The platform's images policy on the three images (tools/image_gate.py): fixable HIGH/CRITICAL vulnerabilities, misconfigurations and
  # secrets block; OS-package licences (Debian GPL/LGPL) and unfixed vulnerabilities are reported; pip/npm licences that are
  # forbidden, restricted or unknown block. trivy is pinned by version and by the sha256 GitHub publishes for the release asset.
  scan:
    needs: [image, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          set -euo pipefail
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          sudo tar -xzf trivy.tgz -C /usr/local/bin trivy
          rm trivy.tgz
      - name: Scan terrier-web, terrier-build and terrier-build-score by digest
        env:
          WEB: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          GEO: ${{ env.BUILD_IMAGE }}@${{ needs.build-image.outputs.geo_digest }}
          SCORE: ${{ env.SCORE_IMAGE }}@${{ needs.build-image.outputs.score_digest }}
        run: python tools/image_gate.py "$WEB" "$GEO" "$SCORE" --report image-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-scan
          path: image-scan.json
          if-no-files-found: ignore

  draft-release:
    needs: [image, build-image, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-files
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # One digests.json for ops/release.py: terrier-web (job image) + terrier-build + terrier-build-score (job build-image).
          # Both files must name the same tag and commit, or nothing is attached.
          jq -e -s '.[0].tag == .[1].tag and .[0].commit == .[1].commit' digests.json terrier-build.digests.json >/dev/null
          jq -s '.[0] + {images: (.[0].images + .[1].images)}' digests.json terrier-build.digests.json > merged.json
          mv merged.json digests.json
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
                 --notes "terrier-web $GITHUB_REF_NAME. Deploy by digest: see digests.json."
          gh release upload "$GITHUB_REF_NAME" digests.json terrier-web.spdx.json terrier-build.digests.json terrier-build.spdx.json terrier-build-score.spdx.json --clobber
